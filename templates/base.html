<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Starry Night Photobooth — Capture beautiful memories beneath the stars">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo_ardraxis.png') }}">
  <title>{% block title %}Starry Night Photobooth{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#0B1E3D',
            deep: '#13294B',
            ocean: '#1D4E89',
            gold: '#F6C667',
            cream: '#FFF3D1',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="font-body bg-midnight text-cream antialiased min-h-screen overflow-x-hidden">
  {% include 'components/stars_background.html' %}

  {% include 'components/navbar.html' %}

  <main class="relative z-10">
    {% block content %}{% endblock %}
  </main>

  {% include 'components/footer.html' %}

  <script src="{{ url_for('static', filename='js/stars.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
